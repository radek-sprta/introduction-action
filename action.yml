name: Introduction Profile README
description: Compose a profile README with the [introduction](https://crates.io/crates/introduction) crate and push it to a repository.
branding:
  icon: user
  color: blue
inputs:
  target-repository:
    description: Repository to update, in owner/name form.
    default: ${{ github.repository }}
  github-token:
    description: GitHub token used to clone and push. Pushing to another repository requires a PAT.
    default: ${{ github.token }}
  gitlab-token:
    description: GitLab token used to fetch GitLab contributions.
    default: ""
  template-file:
    description: Path to the README template.
    default: template.md
  config-file:
    description: Path to the introduction config file.
    default: .introduction.toml
  version:
    description: Version of the introduction crate to install.
    default: 0.2.0
runs:
  using: composite
  steps:
    - name: Install introduction
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: cargo install introduction --version "$VERSION" --locked

    - name: Clone target repository
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        TARGET: ${{ inputs.target-repository }}
      run: git clone "https://x-access-token:${GH_TOKEN}@github.com/${TARGET}.git" target

    - name: Compose README
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        GITLAB_TOKEN: ${{ inputs.gitlab-token }}
        CONFIG: ${{ inputs.config-file }}
        TEMPLATE: ${{ inputs.template-file }}
      run: |
        [ -n "$GITLAB_TOKEN" ] || unset GITLAB_TOKEN
        introduction --config "$CONFIG" compose --template "$TEMPLATE" --output target/README.md

    - name: Commit and push
      shell: bash
      working-directory: target
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add README.md
        git diff --cached --quiet || (git commit -m "chore: update README.md" && git push)
